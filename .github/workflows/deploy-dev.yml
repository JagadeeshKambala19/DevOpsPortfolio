name: Deploy React App to Dev

on:
    push:
        branches:
            - develop

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: 18

            - name: Install dependencies
              run: npm ci

            - name: Build React app
              run: npm run build

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Upload build to S3
              run: |
                  aws s3 sync build/ s3://${{ secrets.DEV_S3_BUCKET }} --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                  --distribution-id ${{ secrets.DEV_CLOUDFRONT_ID }} \
                  --paths "/*"
