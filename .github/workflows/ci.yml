name: CI Validation

on:
    pull_request:
        branches:
            - develop
            - main

jobs:
    validate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: 18

            - name: Install Dependencies
              run: npm ci

            - name: Run Lint
              run: npm run lint --if-present || true

            - name: Run Tests
              run: npm test -- --watchAll=false --passWithNoTests

            - name: Build Application
              run: npm run build
